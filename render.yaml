services:
  - type: web
    name: watercress-cheff-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_TIMEOUT
        value: "120"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: RETRIEVER_K
        value: "3"
      - key: LLM_MODEL
        value: "GLM-4.7-Flash"
      - key: LLM_MAX_RETRIES
        value: "4"
