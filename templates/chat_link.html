<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クレソンAIチャットへ | ナナカファーム</title>
<style>
  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    margin: 0;
  }

  .chat-link-container {
    text-align: center;
    padding: 40px 20px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 100%;
  }

  .chat-link-container h2 {
    color: #2D5A27;
    font-size: 24px;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .chat-link-container p {
    color: #666;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .chat-link-button {
    display: inline-block;
    padding: 18px 36px;
    background: linear-gradient(135deg, #2D5A27 0%, #43a047 100%);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(45, 90, 39, 0.3);
    min-height: 56px;
    min-width: 280px;
    line-height: 20px;
  }

  .chat-link-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(45, 90, 39, 0.4);
  }

  .chat-link-button:active {
    transform: translateY(-1px);
  }

  .emoji-icon {
    font-size: 24px;
    margin-right: 8px;
  }

  /* スマートフォン対応 */
  @media (max-width: 600px) {
    .chat-link-container {
      padding: 30px 15px;
    }

    .chat-link-container h2 {
      font-size: 20px;
    }

    .chat-link-container p {
      font-size: 14px;
    }

    .chat-link-button {
      padding: 16px 28px;
      font-size: 16px;
      min-height: 52px;
      min-width: 240px;
    }
  }

  /* 極小画面対応 */
  @media (max-width: 375px) {
    .chat-link-button {
      padding: 14px 24px;
      font-size: 15px;
      min-height: 48px;
      min-width: 200px;
    }

    .emoji-icon {
      font-size: 20px;
      margin-right: 6px;
    }
  }
</style>
</head>
<body>

<div class="chat-link-container">
  <h2>🌿 クレソンの活用法、AIに相談しよう</h2>
  <p>
    ナナカファームのクレソン料理AIが、今夜のレシピや余ったクレソンの活用法をアドバイスします。<br>
    無料で使えるので、お気軽にどうぞ！
  </p>
  <a href="https://hiroakikody-watercress-cheff-ai.onrender.com" class="chat-link-button">
    <span class="emoji-icon">🌿</span>クレソンの使い方、AIに聞いてみよう
  </a>
</div>

</body>
</html>
